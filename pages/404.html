<!Doctype html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Trang bạn tìm không tồn tại. Quay về trang chủ StayFlow để tiếp tục."
    />
    <title>Không tìm thấy trang · StayFlow</title>
    <!-- Khung trang lỗi dùng chung (font, biến màu, header, bộ nút) -->
    <link rel="stylesheet" href="../shared/error-page.css" />
    <link rel="stylesheet" href="../css/404.css" />
  </head>
  <body>
    <div class="error-page">
      <!-- HEADER: logo StayFlow + liên kết trung tâm trợ giúp -->
      <header class="page-header">
        <a class="brand" href="about.html" aria-label="StayFlow">

          <span class="brand__mark">S</span>
          <span class="brand__name">StayFlow</span>
        </a>
        <a class="header-link" href="#">Trung tâm trợ giúp</a>
      </header>

      <!-- KHỐI GIỮA: hình 404 (4 + vòng tròn la bàn + 4) và các nút điều hướng -->
      <main class="error-main">
        <img
          class="error-code"
          src="../assets/images/404-image.png"
          alt="404"
          width="282"
          height="150"
        />

        <h1 class="error-title">Không tìm thấy trang</h1>
        <p class="error-text">
          Đường dẫn có thể đã thay đổi hoặc không còn tồn tại. Hãy tìm nhanh nội
          dung bạn cần.
        </p>

        <div class="error-actions">
          <!-- Nút chính: quay về trang giới thiệu (trang chủ của StayFlow) -->
          <a class="button button--primary" href="about.html">

            <img
              class="button__icon"
              src="../assets/images/home-icon.png"
              alt=""
              aria-hidden="true"
            />
            Về trang chủ
          </a>

          <!-- Nút phụ: quay lại trang trước (xử lý ở 404.js) -->
          <button class="button button--ghost" id="back-button" type="button">
            <span class="button__arrow" aria-hidden="true">←</span>
            Quay lại
          </button>
        </div>
      </main>

      <!-- FOOTER: dòng bản quyền nhỏ ở sát đáy trang -->
      <footer class="page-footer">© 2026 StayFlow · Hỗ trợ 24/7</footer>
    </div>

    <script src="../js/404.js"></script>
  </body>
</html>
