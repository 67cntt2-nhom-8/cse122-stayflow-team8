<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bạn không có quyền truy cập khu vực này trên StayFlow."
    />
    <title>Không có quyền truy cập · StayFlow</title>
    <!-- Khung trang lỗi dùng chung (font, biến màu, header, bộ nút) -->
    <link rel="stylesheet" href="../shared/error-page.css" />
    <link rel="stylesheet" href="../css/403.css" />
  </head>
  <body>
    <!-- Khung trang chung: header trên, nội dung giữa, footer dưới -->
    <div class="error-page">
      <!-- HEADER: logo StayFlow (o trang giới thiệu) + liên kết trợ giúp -->
      <header class="page-header">
        <a class="brand" href="about.html" aria-label="StayFlow">

          <span class="brand__mark">S</span>
          <span class="brand__name">StayFlow</span>
        </a>
        <!-- ponytail: chưa có URL trang trợ giúp thật nên tạm để "#" -->
        <a class="header-link" href="#">Trung tâm trợ giúp</a>
      </header>

      <!-- KHỐI GIỮA: khác 404 ở chỗ này — chia 2 cột ngang thay vì xếp dọc giữa -->
      <main class="error-main">
        <!-- CỘT TRÁI: ảnh hành lang + icon khiên "không có quyền" đè giữa ảnh -->
        <section class="access-visual" aria-label="Khu vực bị hạn chế truy cập">
          <img
            class="access-visual__image"
            src="../assets/images/403-image.png"
            alt="Hành lang khách sạn với cửa phòng 302"
          />
          <!-- icon có sẵn nền tối ở 4 góc, được CSS bo tròn để chỉ còn thẻ trắng -->
          <img
            class="access-visual__badge"
            src="../assets/images/403-image1.png"
            alt="Biểu tượng không có quyền truy cập"
          />
        </section>

        <!-- CỘT PHẢI: số 403 + tiêu đề + mô tả + 2 nút hành động -->
        <section class="access-content" aria-labelledby="access-title">
          <p class="access-code">403</p>
          <h1 id="access-title">Bạn không có quyền truy cập</h1>
          <p class="access-description">
            Tài khoản hiện tại chưa được cấp quyền xem khu vực này. Nếu bạn cho rằng đây
            là nhầm lẫn, hãy liên hệ quản trị khách sạn.
          </p>

          <div class="access-actions">
            <!-- Nút chính: về trang giới thiệu (trang chủ của StayFlow) -->
            <a class="button button--primary" href="about.html">

              <img
                class="button__icon"
                src="../assets/images/home-icon.png"
                alt=""
                aria-hidden="true"
              />
              Về trang chủ
            </a>

            <!-- Nút phụ: mở thư gửi quản trị; 403.js điền sẵn tiêu đề + nội dung -->
            <a
              class="button button--ghost"
              id="contact-admin"
              href="mailto:admin@stayflow.vn"
            >
              <img
                class="button__icon"
                src="../assets/images/contact-icon.png"
                alt=""
                aria-hidden="true"
              />
              Liên hệ quản trị
            </a>
          </div>
        </section>
      </main>

    <script src="../js/403.js"></script>
  </body>
</html>
